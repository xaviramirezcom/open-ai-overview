[project]
name = "own-overview"
version = "0.1.0"
description = "Build your company's own AI Overview: a transparent, multi-tenant RAG pipeline over Guidewire Cloud Data Access (CDA) data on AWS."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Xavier Ramirez" }]
keywords = ["rag", "guidewire", "cda", "langgraph", "bedrock", "opensearch", "insurance"]

dependencies = [
    "langgraph>=0.2.40",
    "langchain>=0.3.0",
    "langchain-core>=0.3.0",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pyarrow>=16.0",
    "boto3>=1.34",
    "opensearch-py>=2.6",
    "typer>=0.12",
    "rich>=13.7",
]

[project.optional-dependencies]
# Zero-cloud local run: open-source embeddings, no Bedrock needed.
local = [
    "sentence-transformers>=3.0",
    "numpy>=1.26",
]
# Eval + guardrail stage.
evals = [
    "ragas>=0.2",
]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.11",
    "import-linter>=2.0",
    "moto>=5.0",
]

[project.scripts]
own-overview = "own_overview.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["own_overview"]

# ---------------------------------------------------------------------------
# Ruff — lint + format
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# pycodestyle, pyflakes, isort, bugbear, comprehensions, pyupgrade, naming
select = ["E", "F", "I", "B", "C4", "UP", "N", "W"]

[tool.ruff.lint.per-file-ignores]
# Tests use importorskip before imports (E402) and relax naming for fixtures.
"tests/**" = ["N802", "N803", "N806", "E402"]
# Typer requires Option()/Argument() calls in parameter defaults (B008).
"own_overview/cli.py" = ["B008"]

# ---------------------------------------------------------------------------
# mypy — typed public surface, heavy/optional deps stubbed out
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.11"
warn_unused_ignores = true
warn_redundant_casts = true
check_untyped_defs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
no_implicit_optional = true
exclude = ['(^|/)tests/', 'conftest\.py']

[[tool.mypy.overrides]]
# Optional / heavy libraries without type stubs.
module = [
    "langgraph.*",
    "langchain.*",
    "langchain_core.*",
    "boto3.*",
    "botocore.*",
    "opensearchpy.*",
    "pyarrow.*",
    "sentence_transformers.*",
    "numpy.*",
    "sample_data.*",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# Tests exercise behavior, not the type surface.
module = ["tests.*"]
disallow_untyped_defs = false
disallow_incomplete_defs = false

# ---------------------------------------------------------------------------
# pytest + coverage
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["own_overview"]
omit = [
    "*/tests/*",
    "conftest.py",
    # Cloud-only adapters: thin boto3 / opensearch-py wrappers that require live
    # AWS Bedrock / an OpenSearch cluster. They are exercised via the LocalStack
    # + OpenSearch integration path (docker compose), not offline unit tests, so
    # they're excluded from the unit coverage floor. The local/hash fallbacks and
    # the RBAC filter logic they mirror ARE unit-tested.
    "own_overview/llm/bedrock.py",
    "own_overview/embeddings/bedrock.py",
    "own_overview/vectorstore/opensearch_store.py",
]

[tool.coverage.report]
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "\\.\\.\\.",
    "def __repr__",
]
