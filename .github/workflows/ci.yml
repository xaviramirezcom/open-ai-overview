name: CI

# Ground truth for code quality and test integrity. Runs the full gate on the
# code exactly as committed. Local hooks make cheating hard; this makes it
# visible: the green/red check is what a reviewer sees on the PR.

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  quality:
    name: Quality gate (ruff · mypy · import-linter · pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install
        # Core deps + dev tools + numpy (the local vector store needs it). We
        # skip the heavy `local` extra (sentence-transformers/torch): the test
        # suite uses the zero-dependency `hash` embedder, so CI stays fast.
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]' numpy

      - name: Lint (ruff)
        run: ruff check . && ruff format --check .

      - name: Type check (mypy)
        run: mypy own_overview

      - name: Architecture boundaries (import-linter)
        run: lint-imports

      - name: Tests + coverage floor
        # --cov-fail-under enforces the coverage minimum. Lowering it shows up
        # in the diff and in this file's history.
        run: pytest --cov=own_overview --cov-report=term-missing --cov-fail-under=85
